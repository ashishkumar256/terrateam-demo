##########################################################################
# See https://terrateam.io/docs
##########################################################################
name: 'Terrateam Workflow'
on:
  workflow_dispatch:
    inputs:
      # work-token and api-base-url are automatically passed in by the Terrateam backend
      work-token:
        description: 'Work Token'
        required: true
      api-base-url:
        description: 'API Base URL'
      environment:
        description: 'Environment in which to run the action'
        type: environment
      runs_on:
        description: 'runs-on configuration'
        type: string
        default: '"ubuntu-latest"'

jobs:
  terrateam:
    permissions:
      id-token: write
      contents: read
    # runs-on: ${{ fromJSON(github.event.inputs.runs_on) }}
    timeout-minutes: 1440
    name: Terrateam Action
    environment: '${{ github.event.inputs.environment }}'
    runs-on: infra
    steps:
      - uses: actions/checkout@v4

      - name: Debug runner
        run: |
          echo "User: $(whoami)"
          echo "HOME=$HOME"
          pwd
      
          echo "Workspace:"
          ls -la
      
          echo "Root kube dir:"
          if [ -d /root/.kube ]; then
            ls -la /root/.kube
          else
            echo "❌ /root/.kube does not exist on the GitHub Actions runner."
          fi
      
          echo "Home kube dir:"
          if [ -d "$HOME/.kube" ]; then
            ls -la "$HOME/.kube"
          else
            echo "❌ $HOME/.kube does not exist on the GitHub Actions runner."
          fi
      
          echo "KUBECONFIG=${KUBECONFIG:-<not set>}"
      
      - name: Run Terrateam Action
        id: terrateam
        uses: terrateamio/action@v1
        with:
          work-token: '${{ github.event.inputs.work-token }}'
          api-base-url: '${{ github.event.inputs.api-base-url }}'
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          KUBECONFIG: /root/.kube/config
