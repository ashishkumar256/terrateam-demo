engine:
  name: tofu
  version: "1.12.5"

hooks:
  plan:
    pre:
      - type: env
        name: AWS_ACCESS_KEY_ID
        cmd: ['echo', 'test']
      - type: env
        name: AWS_SECRET_ACCESS_KEY
        cmd: ['echo', 'test']
      - type: env
        name: AWS_DEFAULT_REGION
        cmd: ['echo', 'ap-south-1']
      - type: env
        name: AWS_EC2_METADATA_DISABLED
        cmd: ['echo', 'true']
  apply:
    pre:
      - type: env
        name: AWS_ACCESS_KEY_ID
        cmd: ['echo', 'test']
      - type: env
        name: AWS_SECRET_ACCESS_KEY
        cmd: ['echo', 'test']
      - type: env
        name: AWS_DEFAULT_REGION
        cmd: ['echo', 'ap-south-1']
      - type: env
        name: AWS_EC2_METADATA_DISABLED
        cmd: ['echo', 'true']

dirs:
  modules:
    when_modified:
      file_patterns: []

drift:
  enabled: true
  schedules:
    default:
      tag_query: ''
      schedule: daily      
      reconcile: false
      window:
        start: '7:25 EST'
        end: '7:40 EST'
